backend:
  name: github
  repo: MiDNiT/dentammebever
  branch: main
  # Cloudflare Pages sin innebygde OAuth-proxy
  base_url: https://dentammebever.no
  auth_endpoint: /cdn-cgi/pages/oauth/callback

# Publiseringsflyt: Draft → In Review → Ready → Published
publish_mode: editorial_workflow

# Bildeopplasting går til static/bilder/, URL-er blir /bilder/...
media_folder: "static/bilder"
public_folder: "/bilder"

# Norsk brukergrensesnitt
locale: "nb_NO"

collections:
  - name: "garden"
    label: "Hagenotater"
    label_singular: "Notat"
    folder: "content/garden"
    create: true
    slug: "{{slug}}"
    # Zola bruker TOML frontmatter (+++ ... +++)
    format: toml
    extension: md
    frontmatter_delimiter: "+++"
    preview_path: "garden/{{slug}}"
    editor:
      preview: true
    fields:
      - label: "Tittel"
        name: "title"
        widget: "string"
        hint: "Tittelen som vises på siden og i søk."

      - label: "Beskrivelse"
        name: "description"
        widget: "string"
        required: false
        hint: "Kort oppsummering – vises i kortoversikten og Google-søk (maks 160 tegn)."

      - label: "Publiseringsdato"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        default: ""

      - label: "Oppdatert"
        name: "updated"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        required: false
        hint: "Sett denne hvis du oppdaterer et eldre innlegg."

      - label: "Mal"
        name: "template"
        widget: "hidden"
        default: "page.html"

      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - { label: "Filosofi",   value: "filosofi" }
          - { label: "Teknologi",  value: "teknologi" }
          - { label: "Sosiologi",  value: "sosiologi" }
          - { label: "Litteratur", value: "litteratur" }
          - { label: "Økonomi",    value: "økonomi" }
          - { label: "Generelt",   value: "generelt" }
        default: "generelt"
        hint: "Velg den kategorien som passer best."

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Kommaseparerte emneord, f.eks: filosofi, stoisisme, marcus aurelius"
        field:
          label: "Tag"
          name: "tag"
          widget: "string"

      - label: "Innhold"
        name: "body"
        widget: "markdown"
        hint: "Skriv innlegget ditt her. Du kan bruke Markdown-formatering."
        buttons:
          - bold
          - italic
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - code
